# SPDX-License-Identifier: MIT
schema: openautosar.program-governance.v1
status: active
decision_round: 3
planning_capacity:
  engineering_hours_per_week: 10
  primary_developers: 1
  active_major_workstream_limit: 1
confirmed_decisions:
  - id: FD-0001
    topic: product-baseline
    decision: Open source own-OEM ADAS reference platform.
  - id: FD-0002
    topic: adaptive-scope
    decision: Complete Adaptive Platform is a long-term incremental scope.
  - id: FD-0003
    topic: autosar-baseline
    decision: AUTOSAR Adaptive R22-11 is the primary behavior and model baseline.
  - id: FD-0004
    topic: linux-baseline
    decision: AGL Ultimate Unagi 21.0.2 with Yocto Scarthgap 5.0.18.
  - id: FD-0005
    topic: virtual-target
    decision: QEMU x86-64 is the only current target.
  - id: FD-0006
    topic: development-host
    decision: Ubuntu 64-bit host with 16 GB RAM is the current assumption.
  - id: FD-0007
    topic: implementation-language
    decision: C++20 runtime with public ABI policy aligned to R22-11.
  - id: FD-0008
    topic: model-flow
    decision: R22-11 ARXML-first inputs and project-owned typed IR.
  - id: FD-0009
    topic: someip
    decision: Original SOME/IP implementation, UDP first.
  - id: FD-0010
    topic: dds-rtps
    decision: Original DDS/RTPS subset and binding.
  - id: FD-0011
    topic: diagnostics
    decision: UDS over SocketCAN vcan is the first diagnostic transport.
  - id: FD-0012
    topic: ultrasonic-safety
    decision: Fail-silent and degraded ultrasonic behavior is approved.
  - id: FD-0013
    topic: update-management
    decision: Original UCM orchestration over replaceable RAUC A/B backend.
  - id: FD-0014
    topic: ci
    decision: Jenkins is the authoritative CI entry point.
  - id: FD-0015
    topic: license
    decision: MIT applies to original project-authored code.
  - id: FD-0016
    topic: dashboard
    decision: Qt 6 and QML are used for the engineering dashboard.
  - id: FD-0017
    topic: delivery
    decision: OEM export must contain the complete artifact and evidence set.
  - id: FD-0018
    topic: name-risk
    decision: openAUTOSAR is retained as a working name with known legal risk.
